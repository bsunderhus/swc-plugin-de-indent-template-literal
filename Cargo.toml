[package]
name = "swc_plugin_de_indent_template_literal"
authors = ["Bernardo Sunderhus <bernardo.sunderhus@gmail.com>"]
description = "SWC plugin for removing indentation of template literal"
edition = "2021"
license = "MIT"
publish = false
version = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "symbols"

[dependencies]
serde = "1.0.219"
serde_json = "1.0.140"
swc_core = { version = "75.0.0", features = ["ecma_plugin_transform", "common"] }
tracing = { version="0.1.41", features = ["release_max_level_info"] }

[dev-dependencies]
testing = "25.0.0"
tracing-test = "0.2.5"
swc_ecma_parser = "43.0.0"
