name: Publish to npm

# Triggered by pushing a version tag, e.g.:
#   git tag v1.5.1 && git push origin v1.5.1
# Tag version must match package.json's "version" (checked below) so a
# publish always corresponds to an intentional, reviewed release commit.
#
# Publishes via npm's Trusted Publisher (OIDC) flow -- no NPM_TOKEN secret
# needed. This requires a one-time setup on npmjs.com: package Settings ->
# Trusted Publisher -> GitHub Actions, specifying:
#   Organization or user: bsunderhus
#   Repository:            swc-plugin-de-indent-template-literal
#   Workflow filename:     publish.yml
#   Environment:           (leave blank unless you add a GitHub Environment
#                          below and want to require it)
# See https://docs.npmjs.com/trusted-publishers
on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required: lets GitHub mint the OIDC token npm exchanges for a short-lived publish credential
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-wasip1

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --verbose

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22" # trusted publishing requires Node >= 22.14.0
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm CLI >= 11.5.1; the npm version bundled
      # with actions/setup-node's Node build can lag behind, so upgrade it
      # explicitly rather than relying on whatever ships with the runner.
      - name: Ensure npm CLI supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # npm run prepack builds the wasm binary via cargo build-wasi --release
      # and copies it next to package.json; npm publish triggers prepack
      # automatically, but we also want the build to fail loudly here first.
      - name: Build wasm plugin artifact
        run: npm run build

      # No NODE_AUTH_TOKEN / NPM_TOKEN needed: the npm CLI detects the GitHub
      # Actions OIDC environment automatically and exchanges it for a
      # short-lived publish token via the trusted publisher configured on
      # npmjs.com. Provenance attestations are generated automatically too
      # (no --provenance flag required).
      - name: Publish to npm
        run: npm publish --access public
